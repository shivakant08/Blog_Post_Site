version : "3.9"


services:
  frontend:
    build: ./client
    container_name: blog_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://backend:5000/v1/api
    networks:
      - app-network

  backend:
    build: ./server
    container_name: blog_backend
    ports:
      - "5000:5000"
    env_file: 
      - ./server/.env
    depends_on:
      - mongo
      - redis
    networks:
      - app-network

  mongo:
    image: mongo:6
    container_name: blog_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: blog_redis
    ports:
      - "6379:6379"
    networks:
      - app-network

volumes:
  mongo_data:

networks:
  app-network:
  driver: bridge
  